<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Questify — Inbox view exploration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; background: #0a0a0a; color: #fafafa; }
    * { box-sizing: border-box; }
    button { font-family: inherit; color: inherit; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react" src="design-canvas.jsx"></script>
  <script type="text/babel" data-presets="react" src="inbox-variants.jsx"></script>
  <script type="text/babel" data-presets="react">
    const Canvas = window.DesignCanvas;
    const Section = window.DCSection;
    const Artboard = window.DCArtboard;
    const V = window.InboxVariants;

    const App = () => (
      <Canvas
        title="Questify — Inbox view explorations"
        subtitle="From a denser list to triage-first flows that actually empty the inbox."
      >
        <Section id="current" title="Where we are today">
          <Artboard id="cur" label="Current — flat list grouped by region, low density, no triage" width={1120} height={820}>
            <V.Current />
          </Artboard>
        </Section>

        <Section id="density" title="Quick win — fix density first">
          <Artboard id="v1" label="① Compact — single table, sortable columns, 3x denser" width={1120} height={720}>
            <V.Compact />
          </Artboard>
        </Section>

        <Section id="triage" title="Reframe — Inbox = triage zone">
          <Artboard id="v2" label="② Smart sections ★ — auto-group by what each quest needs next" width={1120} height={1000}>
            <V.SmartSections />
          </Artboard>
          <Artboard id="v3" label="③ Triage column — inline keyboard-driven row actions" width={1120} height={820}>
            <V.TriageColumn />
          </Artboard>
        </Section>

        <Section id="flow" title="Dedicated flows">
          <Artboard id="v4" label="④ Spotlight mode — Superhuman-style inbox zero, one at a time" width={1120} height={820}>
            <V.Spotlight />
          </Artboard>
          <Artboard id="v5" label="⑤ Sort lanes — kanban by triage intent" width={1240} height={720}>
            <V.SortLanes />
          </Artboard>
        </Section>
      </Canvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
