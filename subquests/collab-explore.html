<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Questify — Collaboration concepts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; background: #0a0a0a; color: #fafafa; }
    * { box-sizing: border-box; }
    button { font-family: inherit; color: inherit; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react" src="design-canvas.jsx"></script>
  <script type="text/babel" data-presets="react" src="collab-variants.jsx"></script>
  <script type="text/babel" data-presets="react">
    const Canvas = window.DesignCanvas;
    const Section = window.DCSection;
    const Artboard = window.DCArtboard;
    const V = window.CollabVariants;

    const App = () => (
      <Canvas
        title="Questify — Collaboration concepts"
        subtitle="Three strategic directions: cooperative, competitive, and utility. Pick the social model that fits your audience."
      >
        <Section id="coop" title="Cooperative — advance together (most on-brand)">
          <Artboard id="party" label="① Party expedition ★ — everyone's quests feed one shared weekly goal" width={1180} height={760}>
            <V.PartyExpedition />
          </Artboard>
          <Artboard id="buddy" label="⑤ Accountability buddy — 1:1, side-by-side days, nudge, shared streak" width={1180} height={680}>
            <V.Buddy />
          </Artboard>
        </Section>

        <Section id="social" title="Social — a light layer over what exists">
          <Artboard id="friends" label="② Friends & cheers — activity feed, react to completions, friend streaks" width={1180} height={720}>
            <V.FriendsFeed />
          </Artboard>
        </Section>

        <Section id="competitive" title="Competitive — compare & climb">
          <Artboard id="league" label="③ League — weekly XP leaderboard with promotion / relegation" width={1180} height={760}>
            <V.League />
          </Artboard>
        </Section>

        <Section id="utility" title="Utility — real shared work">
          <Artboard id="shared" label="④ Shared project — assignees, who-does-what, invite (e.g. Appartement w/ partner)" width={1180} height={760}>
            <V.SharedProject />
          </Artboard>
        </Section>
      </Canvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
