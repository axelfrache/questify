apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "questify-auth-service.fullname" . }}
  labels:
    {{- include "questify-auth-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "questify-auth-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "questify-auth-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "questify-auth-service.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: auth-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            # Spring profile
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.spring.profile | quote }}
            # Database configuration
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKeys.usernameKey }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKeys.passwordKey }}
            - name: SPRING_DATASOURCE_DRIVER
              value: "org.postgresql.Driver"
            - name: SPRING_JPA_DDL_AUTO
              value: {{ .Values.spring.jpa.ddlAuto | quote }}
            # Public application URL
            - name: APP_PUBLIC_URL
              value: {{ .Values.app.publicUrl | quote }}
            # FerrisKey OIDC configuration
            - name: FERRISKEY_ISSUER_URI
              value: {{ .Values.ferriskey.issuerUri | quote }}
            - name: FERRISKEY_PASSWORD_RESET_URI
              value: {{ .Values.ferriskey.passwordResetUri | quote }}
            - name: FERRISKEY_ADMIN_TOKEN_URI
              value: {{ .Values.ferriskey.adminTokenUri | quote }}
            - name: FERRISKEY_ADMIN_CLIENT_ID
              value: {{ .Values.ferriskey.adminClientId | quote }}
            {{- if .Values.ferriskey.existingSecret }}
            - name: FERRISKEY_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ferriskey.existingSecret }}
                  key: {{ .Values.ferriskey.secretKeys.adminClientSecretKey }}
            {{- end }}
            # RabbitMQ configuration
            - name: SPRING_RABBITMQ_HOST
              value: {{ .Values.rabbitmq.host | quote }}
            - name: SPRING_RABBITMQ_PORT
              value: {{ .Values.rabbitmq.port | quote }}
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingSecret }}
                  key: {{ .Values.rabbitmq.secretKeys.usernameKey }}
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingSecret }}
                  key: {{ .Values.rabbitmq.secretKeys.passwordKey }}
            # JWT configuration
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwt.existingSecret }}
                  key: {{ .Values.jwt.secretKey }}
            - name: JWT_ACCESS_EXPIRATION
              value: {{ .Values.jwt.accessExpiration | quote }}
            - name: JWT_REFRESH_EXPIRATION
              value: {{ .Values.jwt.refreshExpiration | quote }}
            # S3/Garage configuration
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: S3_PUBLIC_URL
              value: {{ .Values.s3.publicUrl | quote }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: {{ .Values.s3.secretKeys.accessKeyKey }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: {{ .Values.s3.secretKeys.secretKeyKey }}
            # Admin credentials
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: {{ .Values.admin.secretKeys.emailKey }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: {{ .Values.admin.secretKeys.passwordKey }}
            # Cookie configuration
            - name: COOKIE_SECURE
              value: {{ .Values.cookie.secure | quote }}
            # CORS configuration
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.cors.allowedOrigins | quote }}
            # Rate limiting
            - name: LOGIN_RATE_LIMIT_IP
              value: {{ .Values.rateLimit.loginIpPerMinute | quote }}
            - name: LOGIN_RATE_LIMIT_EMAIL
              value: {{ .Values.rateLimit.loginEmailPerMinute | quote }}
            - name: REGISTER_RATE_LIMIT_IP
              value: {{ .Values.rateLimit.registerIpPerMinute | quote }}
            - name: REGISTER_RATE_LIMIT_EMAIL
              value: {{ .Values.rateLimit.registerEmailPerMinute | quote }}
            - name: REFRESH_RATE_LIMIT_IP
              value: {{ .Values.rateLimit.refreshIpPerMinute | quote }}
            - name: PASSWORD_RESET_RATE_LIMIT_IP
              value: {{ .Values.rateLimit.passwordResetIpPerMinute | quote }}
            - name: PASSWORD_RESET_RATE_LIMIT_EMAIL
              value: {{ .Values.rateLimit.passwordResetEmailPerMinute | quote }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
