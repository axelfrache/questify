{{- if .Values.ingress.enabled }}
# S3 API endpoint (authenticated operations: upload, etc.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "questify-garage.fullname" . }}-s3
  labels:
    {{- include "questify-garage.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "questify-garage.fullname" . }}
                port:
                  name: s3
---
# Web endpoint (anonymous public reads via Garage website mode)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "questify-garage.fullname" . }}-web
  labels:
    {{- include "questify-garage.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/upstream-vhost: "questify-profiles{{ .Values.config.webRootDomain }}"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /questify-profiles(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "questify-garage.fullname" . }}
                port:
                  name: web
{{- end }}
