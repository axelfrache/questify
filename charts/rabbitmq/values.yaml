image:
  repository: rabbitmq
  tag: "3-management-alpine"
  pullPolicy: IfNotPresent

replicaCount: 1

auth:
  existingSecret: questify-rabbitmq
  secretKeys:
    usernameKey: username
    passwordKey: password
    erlangCookieKey: erlang-cookie

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"

persistence:
  enabled: true
  storageClass: "longhorn"
  size: 2Gi
  accessModes:
    - ReadWriteOnce

service:
  type: ClusterIP
  amqpPort: 5672
  managementPort: 15672

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 6

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 6

nodeSelector: {}
tolerations: []
affinity: {}
