global:
  imageRegistry: "registry.axelfrache.me"

ingress:
  host: app.getquestify.com
  tls:
    enabled: true
    secretName: questify-tls

postgresql:
  persistence:
    size: 20Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

minio:
  persistence:
    size: 50Gi

backend:
  image:
    tag: "v1.0.0"
  replicaCount: 2
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

frontend:
  image:
    tag: "v1.0.0"
  replicaCount: 2
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
