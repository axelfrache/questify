services:
  postgres:
    image: postgres:16-alpine
    container_name: questify-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U questify -d questify" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - questify-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: questify-backend
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - SPRING_JPA_DDL_AUTO=update
      - H2_CONSOLE_ENABLED=false
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=questify-profiles
      - S3_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - questify-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: questify-frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.questify-frontend.rule=Host(`app.getquestify.com`)"
      - "traefik.http.routers.questify-frontend.entrypoints=edge"
      - "traefik.http.services.questify-frontend.loadbalancer.server.port=80"
    networks:
      - questify-network
      - traefik

  minio:
    image: minio/minio:latest
    container_name: questify-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.questify-minio.rule=Host(`s3.getquestify.com`)"
      - "traefik.http.routers.questify-minio.entrypoints=edge"
      - "traefik.http.services.questify-minio.loadbalancer.server.port=9000"
    networks:
      - questify-network
      - traefik

  create-bucket:
    image: minio/mc:latest
    container_name: questify-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c " mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; mc mb myminio/questify-profiles --ignore-existing; mc anonymous set download myminio/questify-profiles; exit 0; "
    networks:
      - questify-network

networks:
  questify-network:
    driver: bridge
  traefik:
    external: true

volumes:
  postgres-data:
  minio-data:
