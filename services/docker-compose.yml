services:
  postgres:
    image: postgres:16-alpine
    container_name: questify-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: questify
      POSTGRES_USER: questify
      POSTGRES_PASSWORD: questify
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questify -d questify"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - questify-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: questify-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: questify
      RABBITMQ_DEFAULT_PASS: questify
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - questify-network

  minio:
    image: minio/minio:latest
    container_name: questify-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - questify-network

  create-bucket:
    image: minio/mc:latest
    container_name: questify-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/questify-profiles --ignore-existing;
      mc anonymous set download myminio/questify-profiles;
      exit 0;
      "
    networks:
      - questify-network

  auth-service:
    build:
      context: .
      dockerfile: questify-auth-service/Dockerfile
    container_name: questify-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/questify
      SPRING_DATASOURCE_USERNAME: questify
      SPRING_DATASOURCE_PASSWORD: questify
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: questify
      RABBITMQ_PASSWORD: questify
      JWT_SECRET: dev-secret-key-minimum-32-characters-long
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: questify-profiles
      S3_PUBLIC_URL: http://localhost:9000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
      COOKIE_SECURE: "false"
      ADMIN_EMAIL: admin@questify.local
      ADMIN_PASSWORD: Admin1234!
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - questify-network

  quest-service:
    build:
      context: .
      dockerfile: questify-quest-service/Dockerfile
    container_name: questify-quest-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/questify
      SPRING_DATASOURCE_USERNAME: quest_svc
      SPRING_DATASOURCE_PASSWORD: quest_svc
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: questify
      RABBITMQ_PASSWORD: questify
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - questify-network

  project-service:
    build:
      context: .
      dockerfile: questify-project-service/Dockerfile
    container_name: questify-project-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/questify
      SPRING_DATASOURCE_USERNAME: project_svc
      SPRING_DATASOURCE_PASSWORD: project_svc
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: questify
      RABBITMQ_PASSWORD: questify
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - questify-network

  progression-service:
    build:
      context: .
      dockerfile: questify-progression-service/Dockerfile
    container_name: questify-progression-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/questify
      SPRING_DATASOURCE_USERNAME: progression_svc
      SPRING_DATASOURCE_PASSWORD: progression_svc
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: questify
      RABBITMQ_PASSWORD: questify
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - questify-network

  stats-service:
    build:
      context: .
      dockerfile: questify-stats-service/Dockerfile
    container_name: questify-stats-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/questify
      SPRING_DATASOURCE_USERNAME: stats_svc
      SPRING_DATASOURCE_PASSWORD: stats_svc
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: questify
      RABBITMQ_PASSWORD: questify
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - questify-network

  admin-service:
    build:
      context: .
      dockerfile: questify-admin-service/Dockerfile
    container_name: questify-admin-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/questify
      SPRING_DATASOURCE_USERNAME: admin_svc
      SPRING_DATASOURCE_PASSWORD: admin_svc
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: questify
      RABBITMQ_PASSWORD: questify
      JWT_PUBLIC_KEY: dev-secret-key-minimum-32-characters-long
      AUTH_SERVICE_URL: http://auth-service:8081
      QUEST_SERVICE_URL: http://quest-service:8082
      PROJECT_SERVICE_URL: http://project-service:8083
      PROGRESSION_SERVICE_URL: http://progression-service:8084
      STATS_SERVICE_URL: http://stats-service:8085
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - questify-network

networks:
  questify-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
