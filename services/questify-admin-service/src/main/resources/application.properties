spring.application.name=questify-admin-service
server.port=8086

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:admin}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=admin
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

questify.jwt.public-key=${JWT_PUBLIC_KEY}

questify.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80}

questify.services.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}
questify.services.quest-url=${QUEST_SERVICE_URL:http://localhost:8082}
questify.services.project-url=${PROJECT_SERVICE_URL:http://localhost:8083}
questify.services.progression-url=${PROGRESSION_SERVICE_URL:http://localhost:8084}
questify.services.stats-url=${STATS_SERVICE_URL:http://localhost:8085}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}
