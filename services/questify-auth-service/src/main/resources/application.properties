spring.application.name=questify-auth-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=auth
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

questify.jwt.secret=${JWT_SECRET}
questify.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
questify.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

questify.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80}

questify.cookie.secure=${COOKIE_SECURE:true}

questify.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
questify.s3.access-key=${S3_ACCESS_KEY:minioadmin}
questify.s3.secret-key=${S3_SECRET_KEY:minioadmin}
questify.s3.bucket=${S3_BUCKET:questify-profiles}
questify.s3.region=${S3_REGION:us-east-1}
questify.s3.public-url=${S3_PUBLIC_URL:http://localhost:9000}

questify.ratelimit.login-ip-per-minute=${LOGIN_RATE_LIMIT_IP:10}
questify.ratelimit.login-email-per-minute=${LOGIN_RATE_LIMIT_EMAIL:5}
questify.ratelimit.register-ip-per-minute=${REGISTER_RATE_LIMIT_IP:3}
questify.ratelimit.refresh-ip-per-minute=${REFRESH_RATE_LIMIT_IP:30}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}
