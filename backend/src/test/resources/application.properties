spring.application.name=questify

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=false

questify.jwt.secret=test-secret-must-be-at-least-32-characters-long-for-tests
questify.jwt.access-expiration=900000
questify.jwt.refresh-expiration=604800000

questify.cors.allowed-origins=http://localhost:5173

questify.s3.endpoint=http://localhost:9000
questify.s3.access-key=minioadmin
questify.s3.secret-key=minioadmin
questify.s3.bucket=questify-profiles
questify.s3.region=us-east-1
questify.s3.public-url=http://localhost:9000
