spring.application.name=questify

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:questify}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# H2 Console (disabled by default)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# JWT Configuration (no default secret - required in env)
questify.jwt.secret=${JWT_SECRET}
questify.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
questify.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration
questify.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80}

# S3 Storage Configuration
questify.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
questify.s3.access-key=${S3_ACCESS_KEY:minioadmin}
questify.s3.secret-key=${S3_SECRET_KEY:minioadmin}
questify.s3.bucket=${S3_BUCKET:questify-profiles}
questify.s3.region=${S3_REGION:us-east-1}
questify.s3.public-url=${S3_PUBLIC_URL:http://localhost:9000}