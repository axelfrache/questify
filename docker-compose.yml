services:
  postgres:
    image: postgres:16-alpine
    container_name: questify-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-questify}
      POSTGRES_USER: ${POSTGRES_USER:-questify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-questify}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-questify} -d ${POSTGRES_DB:-questify}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - questify-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: questify-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-questify}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-questify}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - questify-network

  redis:
    image: redis:7-alpine
    container_name: questify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - questify-network

  garage:
    build:
      context: ./services/garage
      dockerfile: Dockerfile
    container_name: questify-garage
    ports:
      - "3900:3900"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:-GK31c2f27ecc0e4d0c1928e5fa}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:-7d37e5a2f7c18b4e9d5f6a2c3b4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e}
    volumes:
      - ./services/garage/garage.toml:/etc/garage.toml:ro
      - ./services/garage/entrypoint.sh:/entrypoint.sh:ro
      - garage-data:/var/lib/garage
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/garage-ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - questify-network

  auth-service:
    build:
      context: ./services
      dockerfile: questify-auth-service/Dockerfile
    container_name: questify-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-questify}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-questify}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-questify}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-questify}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-questify}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-minimum-32-characters-long}
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID:-GK31c2f27ecc0e4d0c1928e5fa}
      S3_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY:-7d37e5a2f7c18b4e9d5f6a2c3b4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e}
      S3_BUCKET: questify-profiles
      S3_REGION: garage
      S3_PUBLIC_URL: http://localhost:3900
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@questify.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - questify-network

  quest-service:
    build:
      context: ./services
      dockerfile: questify-quest-service/Dockerfile
    container_name: questify-quest-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-questify}
      SPRING_DATASOURCE_USERNAME: ${QUEST_DB_USER:-quest_svc}
      SPRING_DATASOURCE_PASSWORD: ${QUEST_DB_PASSWORD:-quest_svc}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-questify}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-questify}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - questify-network

  project-service:
    build:
      context: ./services
      dockerfile: questify-project-service/Dockerfile
    container_name: questify-project-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-questify}
      SPRING_DATASOURCE_USERNAME: ${PROJECT_DB_USER:-project_svc}
      SPRING_DATASOURCE_PASSWORD: ${PROJECT_DB_PASSWORD:-project_svc}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-questify}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-questify}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - questify-network

  progression-service:
    build:
      context: ./services
      dockerfile: questify-progression-service/Dockerfile
    container_name: questify-progression-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-questify}
      SPRING_DATASOURCE_USERNAME: ${PROGRESSION_DB_USER:-progression_svc}
      SPRING_DATASOURCE_PASSWORD: ${PROGRESSION_DB_PASSWORD:-progression_svc}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-questify}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-questify}
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - questify-network

  stats-service:
    build:
      context: ./services
      dockerfile: questify-stats-service/Dockerfile
    container_name: questify-stats-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-questify}
      SPRING_DATASOURCE_USERNAME: ${STATS_DB_USER:-stats_svc}
      SPRING_DATASOURCE_PASSWORD: ${STATS_DB_PASSWORD:-stats_svc}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-questify}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-questify}
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - questify-network

  admin-service:
    build:
      context: ./services
      dockerfile: questify-admin-service/Dockerfile
    container_name: questify-admin-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-questify}
      SPRING_DATASOURCE_USERNAME: ${ADMIN_DB_USER:-admin_svc}
      SPRING_DATASOURCE_PASSWORD: ${ADMIN_DB_PASSWORD:-admin_svc}
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_JPA_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-questify}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-questify}
      JWT_PUBLIC_KEY: ${JWT_SECRET:-dev-secret-key-minimum-32-characters-long}
      AUTH_SERVICE_URL: http://auth-service:8081
      QUEST_SERVICE_URL: http://quest-service:8082
      PROJECT_SERVICE_URL: http://project-service:8083
      PROGRESSION_SERVICE_URL: http://progression-service:8084
      STATS_SERVICE_URL: http://stats-service:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - questify-network

  gateway:
    image: nginx:alpine
    container_name: questify-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      quest-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      progression-service:
        condition: service_healthy
      stats-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    networks:
      - questify-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: questify-frontend
    ports:
      - "80:8080"
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - questify-network

networks:
  questify-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  garage-data:
  redis-data:
